<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta
            name="description"
            content="A collection of shit ive made for whatever damn reason it so be"
        >

        <title>My corner of the internet</title>

        <link rel="stylesheet" href="style.css">
    </head>


    <body>

        <!--=============================
        Background decoartion
       ===============================-->
        <div class="background-noise"></div>
        <div class="background-grid"></div>

        <main>
            
            <!--====================
            greeting
            =====================-->

            <section class="hero">

                <div class="hero-tag">
                    <span class="status-dot"></span>
                    ONLINE
                </div>

                <h1>
                    WELCOME TO<br>
                    <span>MY CORNER</span><br>
                    OF THE INTERNET
                </h1>

                <P class="hero-description">
                    A constantly expanding collection of shits and giggles, cause I want to make stuff for the purpose of having said stuff made
                </P>

                <div class="hero-divider">
                    <span></span>
                    <span>✦</span>
                    <span></span>
                </div>

            </section>

            <!--====================
            project section
            =====================-->

            <section class="projects-section">

                <div class="section-heading">

                    <div>
                        
                        <p class="eyebrow">// DIRECTORY</p>

                        <h2>
                            PROJECTS
                        </h2>
                        
                    </div>
                    
                    <p class="project-count">

                        <span id="projectCount">0</span>
                        PROJECTS FOUND

                    </p>

                </div>

                <!-- projects shall be inserted via javascript -->
                
                <div
                    id="projectsContainer"
                    class="projects-grid"
                ></div>


                <div
                    id="emptyMessage"
                    class="empty-message"
                    hidden
                >
                    <p>nothing here yet.</p>

                </div>

            </section>

            <!--=====================
            FOOTER
            ======================-->

            <footer>

                <div class="footer-line"></div>

                <div class="footer-content">

                    <p>
                         MADE WITH <span>♥</span> AND QUESTIONABLE DECISIONS
                    </p>

                    <p>
                        @ <span id="year"></span>
                    </p>

                </div>

            </footer>

        </main>

    <script src="script.js"></script>

    </body>
</html>
